name: Playwright Tests - Staging

on:
  push:
    branches: [staging, release/*]
  pull_request:
    branches: [staging, release/*]
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run tests on staging environment"
        required: false
        default: "true"

jobs:
  test-staging:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests (Staging)
        id: test
        env:
          ENV: staging
          STG_BASE_URL: ${{ secrets.STG_BASE_URL || 'https://staging.example.com' }}
          STG_ADMIN_USERNAME: ${{ secrets.STG_ADMIN_USERNAME }}
          STG_ADMIN_PASSWORD: ${{ secrets.STG_ADMIN_PASSWORD }}
          STG_STANDARD_USERNAME: ${{ secrets.STG_STANDARD_USERNAME }}
          STG_STANDARD_PASSWORD: ${{ secrets.STG_STANDARD_PASSWORD }}
        run: npm run test:staging

      - name: Test Summary
        if: always()
        run: |
          echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.test.outcome }}" == "success" ]; then
            echo "✅ **Status:** All tests passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Status:** Tests failed!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📋 Next Steps:" >> $GITHUB_STEP_SUMMARY
            echo "1. Download the test artifacts below" >> $GITHUB_STEP_SUMMARY
            echo "2. Check the HTML report for detailed failure information" >> $GITHUB_STEP_SUMMARY
            echo "3. Review screenshots/videos in test-results folder" >> $GITHUB_STEP_SUMMARY
            echo "4. Reproduce locally: \`npm run test:staging\`" >> $GITHUB_STEP_SUMMARY
            echo "5. Fix the issue and push again" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Staging" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-staging
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-staging
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-staging
          path: test-results/**/*.png
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: videos-staging
          path: test-results/**/*.webm
          retention-days: 14
          if-no-files-found: ignore
