name: Playwright Tests - Development

on:
  push:
    branches: [develop, dev]
  pull_request:
    branches: [develop, dev]
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run tests on dev environment"
        required: false
        default: "true"

jobs:
  test-dev:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests (Dev)
        env:
          ENV: dev
          DEV_BASE_URL: ${{ secrets.DEV_BASE_URL || 'https://dev.example.com' }}
          DEV_ADMIN_USERNAME: ${{ secrets.DEV_ADMIN_USERNAME }}
          DEV_ADMIN_PASSWORD: ${{ secrets.DEV_ADMIN_PASSWORD }}
          DEV_STANDARD_USERNAME: ${{ secrets.DEV_STANDARD_USERNAME }}
          DEV_STANDARD_PASSWORD: ${{ secrets.DEV_STANDARD_PASSWORD }}
        run: npm run test:dev

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-dev
          path: playwright-report/
          retention-days: 7
