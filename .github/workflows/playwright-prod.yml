name: Playwright Tests - Production

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      confirm_prod:
        description: 'Type "yes" to confirm production test run'
        required: true
        default: "no"

jobs:
  test-prod:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    environment: production
    # Only run if explicitly confirmed (for manual dispatch)
    if: github.event_name == 'push' || github.event.inputs.confirm_prod == 'yes'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests (Production)
        id: test
        env:
          ENV: prod
          PROD_BASE_URL: ${{ secrets.PROD_BASE_URL || 'https://www.example.com' }}
          PROD_ADMIN_USERNAME: ${{ secrets.PROD_ADMIN_USERNAME }}
          PROD_ADMIN_PASSWORD: ${{ secrets.PROD_ADMIN_PASSWORD }}
          PROD_STANDARD_USERNAME: ${{ secrets.PROD_STANDARD_USERNAME }}
          PROD_STANDARD_PASSWORD: ${{ secrets.PROD_STANDARD_PASSWORD }}
        run: npm run test:prod

      - name: Test Summary
        if: always()
        run: |
          echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.test.outcome }}" == "success" ]; then
            echo "✅ **Status:** All tests passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "🚨 **Status:** Tests failed in PRODUCTION!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ⚠️ URGENT: Production Test Failure" >> $GITHUB_STEP_SUMMARY
            echo "1. Download the test artifacts below immediately" >> $GITHUB_STEP_SUMMARY
            echo "2. Check the HTML report for detailed failure information" >> $GITHUB_STEP_SUMMARY
            echo "3. Review screenshots/videos in test-results folder" >> $GITHUB_STEP_SUMMARY
            echo "4. Notify the team immediately" >> $GITHUB_STEP_SUMMARY
            echo "5. Investigate root cause" >> $GITHUB_STEP_SUMMARY
            echo "6. Reproduce locally: \`npm run test:prod\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Production" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-prod
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-prod
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-prod
          path: test-results/**/*.png
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: videos-prod
          path: test-results/**/*.webm
          retention-days: 30
          if-no-files-found: ignore
